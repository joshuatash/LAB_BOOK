<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISBAT University — Student Dashboard</title>
    <link rel="stylesheet" href="portal.css">
    <style>
    </style>

<body>
    <aside class="sidebar">
        <img src="isbat-logo.jpg" alt="ISBAT University Logo" class="logo">
        <p class="student-name">Okuta Joshua Tash</p>
        <nav>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="courses.html">My Courses</a>
            <a href="fees.html">Fee Statement</a>
        </nav>
    </aside>
    <main class="main-content">
        <div class="top-header">
            <div>
                <h1>Welcome, Okuta Joshua Tash</h1>

        <section>

                <a href="dashboard.html" class="quick-card">Dashboard</a>
